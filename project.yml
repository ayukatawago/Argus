name: Argus

options:
  bundleIdPrefix: com.argus
  deploymentTarget:
    macOS: "14.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true
  defaultConfig: Debug

configs:
  Debug: debug
  Release: release

packages:
  libghostty-spm:
    url: https://github.com/Lakr233/libghostty-spm.git
    branch: main
  DiffReviewKit:
    path: Packages/DiffReviewKit
  ArgusCore:
    path: Packages/ArgusCore

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_PREVIEWS: "YES"
    ALWAYS_SEARCH_USER_PATHS: "NO"
    SWIFT_STRICT_CONCURRENCY: targeted

targets:
  Argus:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: App
        excludes:
          - "**/*.md"
      - path: Sources/GhosttyBridge
        excludes:
          - "**/*.md"
      # Bundled into Contents/Resources so the CLI ships with the app itself
      # (no git checkout required) and is ready for a future Homebrew cask's
      # `binary` stanza to symlink onto PATH — see script/argus.
      - path: script/argus
        buildPhase: resources
    dependencies:
      - package: libghostty-spm
        product: GhosttyTerminal
      - package: DiffReviewKit
        product: DiffReviewKit
      - package: ArgusCore
        product: ArgusSupport
      - package: ArgusCore
        product: ArgusConfigKit
      - package: ArgusCore
        product: AgentStateKit
      - package: ArgusCore
        product: Workspaces
      - package: ArgusCore
        product: Monitors
      - sdk: WebKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.argus.app
        INFOPLIST_FILE: App/Info.plist
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        CODE_SIGNING_REQUIRED: "NO"
        ENABLE_HARDENED_RUNTIME: "NO"
        COMBINE_HIDPI_IMAGES: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/App/Argus-Bridging-Header.h"
      debug:
        SWIFT_OPTIMIZATION_LEVEL: "-Onone"
        DEBUG_INFORMATION_FORMAT: dwarf
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        # Stable local identity (not ad-hoc) so macOS TCC grants for the panes'
        # spawned shells survive rebuilds instead of re-prompting every launch.
        # Not for distribution — see CLAUDE.md.
        CODE_SIGN_IDENTITY: "Argus Local Dev"
        CODE_SIGNING_REQUIRED: "YES"
      release:
        SWIFT_OPTIMIZATION_LEVEL: "-O"
        DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"
    preBuildScripts:
      - name: SwiftLint
        showEnvVars: false
        basedOnDependencyAnalysis: false
        script: |
          if which swiftlint > /dev/null; then
            swiftlint --config "${SRCROOT}/.swiftlint.yml" --quiet
          else
            echo "warning: SwiftLint not installed — run: brew install swiftlint"
          fi

  ArgusTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources: []
    dependencies:
      - target: Argus
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.argus.app.tests
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        CODE_SIGNING_REQUIRED: "NO"
        GENERATE_INFOPLIST_FILE: "YES"
