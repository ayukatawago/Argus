<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="marked.min.js"></script>
    <style>
      :root {
        color-scheme: light dark;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
        font-size: 15px;
        line-height: 1.65;
        max-width: 1600px;
        margin: 0 auto;
        padding: 32px 40px 80px;
        background: #ffffff;
        color: #1c1c1e;
      }

      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        font-weight: 600;
        line-height: 1.3;
        margin: 24px 0 12px;
      }
      h1 {
        font-size: 1.9em;
        border-bottom: 1px solid #e5e5ea;
        padding-bottom: 8px;
        margin-top: 0;
      }
      h2 {
        font-size: 1.4em;
        border-bottom: 1px solid #e5e5ea;
        padding-bottom: 6px;
      }
      h3 {
        font-size: 1.15em;
      }

      p {
        margin: 0 0 14px;
      }

      a {
        color: #0066cc;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }

      code {
        font-family: "SF Mono", Menlo, Consolas, "Courier New", monospace;
        font-size: 0.875em;
        background: #f2f2f7;
        color: #1c1c1e;
        padding: 2px 5px;
        border-radius: 4px;
      }

      pre {
        background: #f2f2f7;
        border: 1px solid #e5e5ea;
        border-radius: 8px;
        padding: 14px 16px;
        overflow-x: auto;
        margin: 0 0 16px;
      }
      pre code {
        background: none;
        color: inherit;
        padding: 0;
        border-radius: 0;
        font-size: 13px;
      }

      table {
        border-collapse: collapse;
        width: 100%;
        margin: 16px 0;
      }
      th,
      td {
        border: 1px solid #d1d1d6;
        padding: 8px 12px;
        text-align: left;
        vertical-align: top;
      }
      th {
        background: #f2f2f7;
        font-weight: 600;
      }
      tr:nth-child(even) {
        background: #f9f9fb;
      }

      blockquote {
        border-left: 3px solid #c7c7cc;
        margin: 0 0 14px;
        padding: 2px 16px;
        color: #3a3a3c;
      }

      hr {
        border: none;
        border-top: 1px solid #e5e5ea;
        margin: 24px 0;
      }

      ul,
      ol {
        padding-left: 24px;
        margin: 0 0 14px;
      }
      li {
        margin-bottom: 4px;
      }
      li > ul,
      li > ol {
        margin-top: 4px;
        margin-bottom: 0;
      }

      img {
        max-width: 100%;
        height: auto;
      }

      /* Dark mode — must be last so it overrides the base styles above */
      @media (prefers-color-scheme: dark) {
        body {
          background: #1c1c1e;
          color: #f0f0f0;
        }
        h1,
        h2 {
          border-bottom-color: #3a3a3c;
        }
        a {
          color: #4da3ff;
        }
        code {
          background: #3a3a3c;
          color: #f0f0f0;
        }
        pre {
          background: #2a2a2c;
          border-color: #4a4a4c;
        }
        pre code {
          background: none;
          color: #f0f0f0;
        }
        th,
        td {
          border-color: #4a4a4c;
        }
        th {
          background: #2c2c2e;
        }
        tr:nth-child(even) {
          background: #242426;
        }
        blockquote {
          border-left-color: #48484a;
          color: #b0b0b8;
        }
        hr {
          border-top-color: #3a3a3c;
        }
      }
    </style>
  </head>
  <body>
    <div id="content"></div>
    <script>
      var markdownContent = {{MARKDOWN_JSON}};
      document.getElementById("content").innerHTML = marked.parse(markdownContent);
    </script>
  </body>
</html>
