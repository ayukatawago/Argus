<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="marked.min.js"></script>
<style>
:root { color-scheme: light dark; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  font-size: 15px;
  line-height: 1.65;
  max-width: 820px;
  margin: 0 auto;
  padding: 32px 40px 80px;
  background: #ffffff;
  color: #1c1c1e;
}

@media (prefers-color-scheme: dark) {
  body { background: #1c1c1e; color: #d4d4d4; }
  code { background: #2c2c2e; }
  pre { background: #2c2c2e; border-color: #3a3a3c; }
  table th { background: #2c2c2e; }
  table tr:nth-child(even) { background: #242426; }
  blockquote { border-left-color: #3a3a3c; color: #8e8e93; }
  a { color: #4da3ff; }
  hr { border-top-color: #3a3a3c; }
  h1, h2 { border-bottom-color: #3a3a3c; }
  th, td { border-color: #3a3a3c; }
}

h1, h2, h3, h4, h5, h6 {
  font-weight: 600;
  line-height: 1.3;
  margin: 24px 0 12px;
}
h1 { font-size: 1.9em; border-bottom: 1px solid #e5e5ea; padding-bottom: 8px; margin-top: 0; }
h2 { font-size: 1.4em; border-bottom: 1px solid #e5e5ea; padding-bottom: 6px; }
h3 { font-size: 1.15em; }

p { margin: 0 0 14px; }

a { color: #0066cc; text-decoration: none; }
a:hover { text-decoration: underline; }

code {
  font-family: "SF Mono", Menlo, Consolas, "Courier New", monospace;
  font-size: 0.875em;
  background: #f2f2f7;
  padding: 2px 5px;
  border-radius: 4px;
}

pre {
  background: #f2f2f7;
  border: 1px solid #e5e5ea;
  border-radius: 8px;
  padding: 14px 16px;
  overflow-x: auto;
  margin: 0 0 16px;
}
pre code { background: none; padding: 0; border-radius: 0; font-size: 13px; }

table { border-collapse: collapse; width: 100%; margin: 16px 0; }
th, td { border: 1px solid #d1d1d6; padding: 8px 12px; text-align: left; vertical-align: top; }
th { background: #f2f2f7; font-weight: 600; }
tr:nth-child(even) { background: #f9f9fb; }

blockquote {
  border-left: 3px solid #d1d1d6;
  margin: 0 0 14px;
  padding: 2px 16px;
  color: #6c6c70;
}

hr { border: none; border-top: 1px solid #e5e5ea; margin: 24px 0; }

ul, ol { padding-left: 24px; margin: 0 0 14px; }
li { margin-bottom: 4px; }
li > ul, li > ol { margin-top: 4px; margin-bottom: 0; }

img { max-width: 100%; height: auto; }
</style>
</head>
<body>
<div id="content"></div>
<script>
var markdownContent = {{MARKDOWN_JSON}};
document.getElementById("content").innerHTML = marked.parse(markdownContent);
</script>
</body>
</html>
