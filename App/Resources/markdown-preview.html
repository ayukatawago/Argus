<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
    <style>
      :root {
        color-scheme: light dark;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        display: flex;
        font-family:
          -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
        font-size: 15px;
        background: #ffffff;
        color: #1c1c1e;
      }

      /* ── Sidebar ─────────────────────────────────────────── */
      #sidebar {
        width: 220px;
        min-width: 140px;
        overflow-y: auto;
        border-right: 1px solid #e5e5ea;
        background: #f7f7f7;
        padding: 8px 0 24px;
        font-size: 13px;
        flex-shrink: 0;
        user-select: none;
      }

      details.tree-dir > summary {
        list-style: none;
        cursor: default;
        padding: 5px 10px 3px;
        font-weight: 600;
        color: #6c6c70;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      details.tree-dir > summary::-webkit-details-marker {
        display: none;
      }
      details.tree-dir > summary::before {
        content: "▸ ";
      }
      details.tree-dir[open] > summary::before {
        content: "▾ ";
      }

      .tree-children {
        padding-left: 10px;
      }

      a.tree-file {
        display: block;
        padding: 4px 10px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        color: #1c1c1e;
        text-decoration: none;
        border-radius: 5px;
        margin: 1px 4px;
      }
      a.tree-file:hover {
        background: #e8e8e8;
        text-decoration: none;
      }
      a.tree-file.active {
        background: #0066cc;
        color: #ffffff;
      }
      a.tree-file.active:hover {
        background: #0055bb;
      }

      /* ── Main content ────────────────────────────────────── */
      #main {
        flex: 1;
        overflow-y: auto;
        padding: 32px 40px 80px;
        line-height: 1.65;
      }

      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        font-weight: 600;
        line-height: 1.3;
        margin: 24px 0 12px;
      }
      h1 {
        font-size: 1.9em;
        border-bottom: 1px solid #e5e5ea;
        padding-bottom: 8px;
        margin-top: 0;
      }
      h2 {
        font-size: 1.4em;
        border-bottom: 1px solid #e5e5ea;
        padding-bottom: 6px;
      }
      h3 {
        font-size: 1.15em;
      }

      p {
        margin: 0 0 14px;
      }

      a {
        color: #0066cc;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }

      code {
        font-family: "SF Mono", Menlo, Consolas, "Courier New", monospace;
        font-size: 0.875em;
        background: #f2f2f7;
        color: #1c1c1e;
        padding: 2px 5px;
        border-radius: 4px;
      }

      pre {
        background: #f2f2f7;
        border: 1px solid #e5e5ea;
        border-radius: 8px;
        padding: 14px 16px;
        overflow-x: auto;
        margin: 0 0 16px;
      }
      pre code {
        background: none;
        color: inherit;
        padding: 0;
        border-radius: 0;
        font-size: 13px;
      }

      table {
        border-collapse: collapse;
        width: 100%;
        margin: 16px 0;
      }
      th,
      td {
        border: 1px solid #d1d1d6;
        padding: 8px 12px;
        text-align: left;
        vertical-align: top;
      }
      th {
        background: #f2f2f7;
        font-weight: 600;
      }
      tr:nth-child(even) {
        background: #f9f9fb;
      }

      blockquote {
        border-left: 3px solid #c7c7cc;
        margin: 0 0 14px;
        padding: 2px 16px;
        color: #3a3a3c;
      }

      hr {
        border: none;
        border-top: 1px solid #e5e5ea;
        margin: 24px 0;
      }

      ul,
      ol {
        padding-left: 24px;
        margin: 0 0 14px;
      }
      li {
        margin-bottom: 4px;
      }
      li > ul,
      li > ol {
        margin-top: 4px;
        margin-bottom: 0;
      }

      img {
        max-width: 100%;
        height: auto;
      }

      .mermaid {
        text-align: center;
        margin: 16px 0;
        overflow-x: auto;
      }
      .mermaid svg {
        max-width: 100%;
        height: auto;
      }
      .mermaid-error {
        text-align: left;
        color: #c0392b;
        background: #fdecea;
        border: 1px solid #e74c3c;
        border-radius: 6px;
        padding: 12px 14px;
        margin: 16px 0;
      }
      .mermaid-error b {
        display: block;
        margin-bottom: 8px;
      }
      .mermaid-error pre {
        margin: 0;
        font-size: 12px;
        white-space: pre-wrap;
        word-break: break-word;
        background: none;
        border: none;
        padding: 0;
        color: inherit;
      }

      @media (prefers-color-scheme: dark) {
        .mermaid-error {
          color: #ff8a80;
          background: #3a1515;
          border-color: #c0392b;
        }
      }

      /* Dark mode — must be last so it overrides the base styles above */
      @media (prefers-color-scheme: dark) {
        body {
          background: #1c1c1e;
          color: #f0f0f0;
        }
        #sidebar {
          background: #161618;
          border-right-color: #2c2c2e;
        }
        details.tree-dir > summary {
          color: #8e8e93;
        }
        a.tree-file {
          color: #f0f0f0;
        }
        a.tree-file:hover {
          background: #2c2c2e;
        }
        a.tree-file.active {
          background: #1a56c4;
        }
        a.tree-file.active:hover {
          background: #1648a8;
        }
        h1,
        h2 {
          border-bottom-color: #3a3a3c;
        }
        a {
          color: #4da3ff;
        }
        code {
          background: #3a3a3c;
          color: #f0f0f0;
        }
        pre {
          background: #2a2a2c;
          border-color: #4a4a4c;
        }
        pre code {
          background: none;
          color: #f0f0f0;
        }
        th,
        td {
          border-color: #4a4a4c;
        }
        th {
          background: #2c2c2e;
        }
        tr:nth-child(even) {
          background: #242426;
        }
        blockquote {
          border-left-color: #48484a;
          color: #b0b0b8;
        }
        hr {
          border-top-color: #3a3a3c;
        }
      }
    </style>
  </head>
  <body>
    <div id="sidebar"></div>
    <div id="main">
      <div id="content"></div>
    </div>
    <script>
      var MARKDOWN_CONTENT = {{MARKDOWN_JSON}};
      var FILE_TREE = {{FILE_TREE_JSON}};
      var CURRENT_FILE_PATH = {{CURRENT_FILE_JSON}};

      document.getElementById("content").innerHTML = marked.parse(MARKDOWN_CONTENT);

      // Convert fenced ```mermaid blocks to div.mermaid for the renderer
      document.querySelectorAll("pre code.language-mermaid").forEach(function (el) {
        var div = document.createElement("div");
        div.className = "mermaid";
        div.textContent = el.textContent;
        el.closest("pre").replaceWith(div);
      });

      if (typeof mermaid !== "undefined") {
        var isDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        mermaid.initialize({ startOnLoad: false, theme: isDark ? "dark" : "default" });
        var mermaidDivs = Array.from(document.querySelectorAll("div.mermaid"));
        var validDivs = [];
        Promise.all(mermaidDivs.map(function (div) {
          return mermaid.parse(div.textContent).then(function () {
            validDivs.push(div);
          }).catch(function (err) {
            var msg = (err && err.message) ? err.message : String(err);
            div.innerHTML =
              '<div class="mermaid-error"><b>Mermaid error</b><pre>' +
              escHtml(msg) +
              "</pre></div>";
          });
        })).then(function () {
          if (validDivs.length > 0) {
            mermaid.run({ nodes: validDivs }).catch(function () {});
          }
        });
      }

      function escHtml(s) {
        return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }

      function buildTree(items) {
        var html = "";
        for (var i = 0; i < items.length; i++) {
          var item = items[i];
          if (item.type === "dir" && item.children && item.children.length > 0) {
            html += '<details class="tree-dir" open>';
            html += "<summary>" + escHtml(item.name) + "</summary>";
            html += '<div class="tree-children">' + buildTree(item.children) + "</div>";
            html += "</details>";
          } else if (item.type === "file" && item.path) {
            var active = item.path === CURRENT_FILE_PATH ? " active" : "";
            var href = encodeURI("file://" + item.path);
            html +=
              '<a class="tree-file' + active + '" href="' + href + '">' + escHtml(item.name) + "</a>";
          }
        }
        return html;
      }

      document.getElementById("sidebar").innerHTML = buildTree(FILE_TREE);

      var savedScroll = localStorage.getItem("sidebarScrollTop");
      if (savedScroll) document.getElementById("sidebar").scrollTop = parseInt(savedScroll, 10);

      document.addEventListener("click", function (e) {
        var a = e.target.closest("a");
        if (a && a.href) {
          e.preventDefault();
          localStorage.setItem("sidebarScrollTop", document.getElementById("sidebar").scrollTop);
          window.webkit.messageHandlers.linkClicked.postMessage(a.href);
        }
      });
    </script>
  </body>
</html>
